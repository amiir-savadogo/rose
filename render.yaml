databases:
  - name: rose-db
    plan: free
    databaseName: rose
    user: rose

services:
  - type: web
    name: rose
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz/
    envVars:
      - key: PORT
        value: "8000"
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # L'hôte exact du service est ajouté automatiquement (RENDER_EXTERNAL_HOSTNAME).
      # Pour un domaine personnalisé : DJANGO_ALLOWED_HOSTS et DJANGO_CSRF_TRUSTED_ORIGINS.
      - key: DJANGO_SSL_REDIRECT
        value: "True"
      - key: DJANGO_HSTS_SECONDS
        value: "2592000"
      - key: POSTGRES_DB
        fromDatabase: { name: rose-db, property: database }
      - key: POSTGRES_USER
        fromDatabase: { name: rose-db, property: user }
      - key: POSTGRES_PASSWORD
        fromDatabase: { name: rose-db, property: password }
      - key: POSTGRES_HOST
        fromDatabase: { name: rose-db, property: host }
      - key: POSTGRES_PORT
        fromDatabase: { name: rose-db, property: port }
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      # À renseigner dans le tableau de bord Render (jamais dans ce fichier public).
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
