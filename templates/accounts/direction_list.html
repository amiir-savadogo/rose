{% extends "base.html" %}
{% block title %}Directions / Entités{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2><i class="bi bi-diagram-3"></i> Directions / Entités</h2>
  <a href="{% url 'accounts:direction_creer' %}" class="btn btn-rose-primary">+ Nouvelle direction</a>
</div>
<div class="rose-panel">
  <table class="table rose-table mb-0">
    <thead><tr><th>Nom</th><th>Description</th></tr></thead>
    <tbody>
      {% for d in directions %}
      <tr><td>{{ d.nom }}</td><td class="text-muted">{{ d.description|default:"—" }}</td></tr>
      {% empty %}
      <tr><td colspan="2" class="text-center text-muted py-4">Aucune direction définie.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
