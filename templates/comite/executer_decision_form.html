{% extends "base.html" %}
{% block title %}Marquer exécutée{% endblock %}
{% block content %}
<h2 class="mb-4" style="font-size:1.3rem;">Marquer la décision comme exécutée</h2>
<div class="rose-panel" style="max-width:500px;">
  <p class="text-muted small">{{ decision.libelle }}</p>
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
    <div class="mb-3">
      <label class="form-label">{{ field.label }}</label>
      {{ field }}
    </div>
    {% endfor %}
    <button type="submit" class="btn btn-rose-primary">Confirmer</button>
    <a href="{% url 'comite:dossier' decision.seance_id %}" class="btn btn-link">Annuler</a>
  </form>
</div>
{% endblock %}
