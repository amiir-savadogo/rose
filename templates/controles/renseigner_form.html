{% extends "base.html" %}
{% block title %}Renseigner l'exécution{% endblock %}
{% block content %}
<h2 class="mb-4" style="font-size:1.3rem;">Renseigner l'exécution — {{ execution.controle.nom }}</h2>
<div class="rose-panel" style="max-width:600px;">
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {% for field in form %}
    <div class="mb-3">
      <label class="form-label">{{ field.label }}</label>
      {{ field }}
    </div>
    {% endfor %}
    <button type="submit" class="btn btn-rose-primary">Enregistrer</button>
    <a href="{% url 'controles:executions' %}" class="btn btn-link">Annuler</a>
  </form>
</div>
{% endblock %}
