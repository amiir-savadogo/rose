{% extends "base.html" %}
{% block title %}Nouvelle campagne{% endblock %}
{% block content %}
<h2 class="mb-4" style="font-size:1.3rem;">Nouvelle campagne de revue</h2>
<div class="rose-panel" style="max-width:600px;">
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
    <div class="mb-3">
      <label class="form-label">{{ field.label }}</label>
      {{ field }}
    </div>
    {% endfor %}
    <button type="submit" class="btn btn-rose-primary">Ouvrir la campagne</button>
    <a href="{% url 'risks:campagnes' %}" class="btn btn-link">Annuler</a>
  </form>
</div>
{% endblock %}
