{% extends "base.html" %}
{% block title %}Évaluer {{ risque.titre }}{% endblock %}
{% block content %}
<h2 class="mb-4" style="font-size:1.3rem;">Nouvelle évaluation — {{ risque.titre }}</h2>
<div class="rose-panel" style="max-width:700px;">
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
    <div class="mb-3">
      <label class="form-label">{{ field.label }}</label>
      {{ field }}
      {% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}
    </div>
    {% endfor %}
    <button type="submit" class="btn btn-rose-primary">Enregistrer l'évaluation</button>
    <a href="{% url 'risks:detail' risque.pk %}" class="btn btn-link">Annuler</a>
  </form>
</div>
{% endblock %}
