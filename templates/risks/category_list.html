{% extends "base.html" %}
{% block title %}Catégories de risques{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2><i class="bi bi-tags"></i> Catégories de risques</h2>
  <a href="{% url 'risks:categorie_creer' %}" class="btn btn-rose-primary">+ Nouvelle catégorie</a>
</div>
<div class="rose-panel">
  <table class="table rose-table mb-0">
    <thead><tr><th>Nom</th><th>Description</th></tr></thead>
    <tbody>
      {% for c in categories %}
      <tr><td>{{ c.nom }}</td><td class="text-muted">{{ c.description|default:"—" }}</td></tr>
      {% empty %}
      <tr><td colspan="2" class="text-center text-muted py-4">Aucune catégorie définie.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
